name: Build Auto Clicker Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "rebuild/**"
    paths:
      - "OCR-AutoClicker/**"
      - ".github/workflows/build-ocr.yml"

concurrency:
  group: auto-clicker-beta-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Auto Clicker APK
        run: gradle -p OCR-AutoClicker assembleDebug

      - name: Verify APK exists
        run: test -s OCR-AutoClicker/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Auto-Clicker-Beta-1.0.0
          path: OCR-AutoClicker/app/build/outputs/apk/debug/app-debug.apk
