name: Build OCR Auto Clicker

on:
  workflow_dispatch:
  push:
    branches: [main, 'optimize/**']
    paths:
      - 'OCR-AutoClicker/**'
      - '.github/workflows/build-ocr.yml'

concurrency:
  group: ocr-auto-clicker-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build optimized release APK
        run: gradle -p OCR-AutoClicker assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: OCR-AutoClicker-Beta-093
          path: OCR-AutoClicker/app/build/outputs/apk/release/app-release-unsigned.apk
