name: build-layer
on:
  workflow_dispatch:
  push:
    paths:
      - 'dsr-vklayer/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsr-vklayer
    steps:
      - uses: actions/checkout@v4

      - name: Cabecalhos Vulkan
        run: git clone --depth 1 --branch v1.3.280 https://github.com/KhronosGroup/Vulkan-Headers.git vkh

      - name: Compilar a camada (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ls -la build/*.so

      - name: Empacotar APK da camada
        run: bash scripts/make_layer_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dsr-vklayer
          path: dsr-vklayer/out/*
